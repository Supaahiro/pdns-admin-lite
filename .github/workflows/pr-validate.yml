# .github/workflows/pr-validate.yml
# Version: 1.1.0 (2026-07-18)
#
# Changelog:
#   1.1.0 - New docker job: builds — without pushing — whichever image's
#           Dockerfile the PR changes, reusing the release build's gha cache
#           read-only. Closes the gap where a broken Dockerfile only surfaced
#           at release time (pushes that don't publish build nothing).
#   1.0.0 - Baseline: imported from schwifty-lab's pr-validate-pdns-admin-lite.yml
#           (projects/pdns-admin-lite/{backend,frontend} paths collapsed to
#           backend/ and frontend/ now that this project is its own repo) and
#           restructured on the blog convention: single entry-point workflow,
#           gated per job via dorny/paths-filter so skipped jobs report
#           'skipped' (which branch protection treats as passing) instead of
#           leaving required checks stuck on 'Expected'. Adds a changes-and-lint
#           job (YAML lint) and a toolchain composite action as the single
#           source of truth for the Python/Node versions.

name: PR Validation

on:
  pull_request:
    # No paths filter here on purpose: the workflow must always trigger so
    # every job reports a conclusion (success or skipped) and required checks
    # never hang on 'Expected'. Path-based gating happens per job/step below.
    branches:
      - develop
      - master

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Changed paths + cheap lints ─────────────────────────────────────────────
  changes-and-lint:
    name: Changes & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      docker_backend: ${{ steps.filter.outputs.docker_backend }}
      docker_frontend: ${{ steps.filter.outputs.docker_frontend }}
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/versions.json'
              - '.github/actions/toolchain/**'
              - '.github/workflows/pr-validate.yml'
            frontend:
              - 'frontend/**'
              - '.github/versions.json'
              - '.github/actions/toolchain/**'
              - '.github/workflows/pr-validate.yml'
            docker_backend:
              - 'backend/Dockerfile'
              - 'backend/.dockerignore'
            docker_frontend:
              - 'frontend/Dockerfile'
              - 'frontend/.dockerignore'
            yaml:
              - '**/*.yaml'
              - '**/*.yml'

      - id: toolchain
        if: steps.filter.outputs.yaml == 'true'
        uses: ./.github/actions/toolchain

      - name: Setup Python
        if: steps.filter.outputs.yaml == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: ${{ steps.toolchain.outputs.python }}

      - name: Lint YAML
        if: steps.filter.outputs.yaml == 'true'
        run: |
          pip install yamllint
          yamllint -c .yamllint.yml .

  # ── Backend ─────────────────────────────────────────────────────────────────
  backend:
    name: Backend — Test
    needs: changes-and-lint
    # '!cancelled()' so a lint failure upstream doesn't block this job — the
    # filter step runs first in changes-and-lint, so its outputs are set even
    # when a later lint step fails.
    if: ${{ !cancelled() && needs.changes-and-lint.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - id: toolchain
        uses: ./.github/actions/toolchain

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ steps.toolchain.outputs.python }}

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies
        working-directory: backend
        run: poetry install

      - name: Run tests
        working-directory: backend
        run: poetry run pytest -v

  # ── Frontend ────────────────────────────────────────────────────────────────
  frontend:
    name: Frontend — Build
    needs: changes-and-lint
    if: ${{ !cancelled() && needs.changes-and-lint.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - id: toolchain
        uses: ./.github/actions/toolchain

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.toolchain.outputs.node }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type-check and build
        working-directory: frontend
        run: npm run build

  # ── Docker build check ──────────────────────────────────────────────────────
  # Builds (push: false) whichever image's Dockerfile the PR touches. Without
  # this, a broken Dockerfile only surfaces at release time: pushes that don't
  # publish build nothing. Reuses the release build's gha cache read-only
  # (cache-from only, no cache-to), so PRs never pollute it; on a cache miss
  # buildx just builds from scratch.
  docker:
    name: Docker — Build Check
    needs: changes-and-lint
    if: ${{ !cancelled() && (needs.changes-and-lint.outputs.docker_backend == 'true' || needs.changes-and-lint.outputs.docker_frontend == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build backend image
        if: needs.changes-and-lint.outputs.docker_backend == 'true'
        uses: docker/build-push-action@v7
        with:
          context: backend
          file: backend/Dockerfile
          push: false
          build-args: |
            BUILD_VERSION=0.0.0-pr.${{ github.event.pull_request.number }}
            BUILD_SHA=${{ github.sha }}
          cache-from: type=gha,scope=backend

      - name: Build frontend image
        if: needs.changes-and-lint.outputs.docker_frontend == 'true'
        uses: docker/build-push-action@v7
        with:
          context: frontend
          file: frontend/Dockerfile
          push: false
          build-args: |
            BUILD_VERSION=0.0.0-pr.${{ github.event.pull_request.number }}
            BUILD_SHA=${{ github.sha }}
          cache-from: type=gha,scope=frontend
