[project]
name = "pdns-admin-lite-backend"
version = "0.1.0"
description = "Minimal FastAPI adapter over the PowerDNS Authoritative REST API for the pdns-admin-lite POC."
authors = [
    {name = "Hiro",email = "webmaster@supaahiro.org"}
]
license = {text = "**No-Commercial License** (see LICENSE file)"}
requires-python = ">=3.12,<4.0.0"

dependencies = [
    "fastapi>=0.143.0,<0.144",
    "uvicorn[standard]>=0.54.0,<0.55",
    "httpx>=0.28.1,<0.29",
    "pydantic-settings>=2.15.0,<3",
    "pyjwt[crypto]>=2.15.1,<3",
    "scalar-fastapi>=1.9.1,<2",
]

[dependency-groups]
dev = [
    "black>=26.10.0,<27",
    "isort>=9.0.2,<10",
    "pytest>=9.1.1,<10",
    "respx>=0.23.1,<0.24",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
