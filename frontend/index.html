<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>pdns-admin-lite</title>
  </head>
  <body>
    <div id="app"></div>
    <!-- Populated at container start time (see docker-entrypoint.d/); this
         classic script runs before the deferred module script below, so
         window.__ENV__ is always set by the time App.vue reads it. Missing
         in `npm run dev` (no nginx entrypoint) — App.vue defaults to
         DEVELOPMENT when window.__ENV__ is absent. -->
    <script src="/env.js"></script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
